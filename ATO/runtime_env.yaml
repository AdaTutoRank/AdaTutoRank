working_dir: ./
excludes:
  - "/.git/"
  - "**/__pycache__/"
  - "**/*.pyc"
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_USE_V1: "1"
  VERL_LOGGING_LEVEL: "INFO"
  TASK: "${TASK}"
  TENSORBOARD_DIR: "${TENSORBOARD_LOG_DIR}"
  REWARD_PARALLEL_WORKERS: "${REWARD_PARALLEL_WORKERS}"
  RUBRIC_FMT_MODE: "${RUBRIC_FMT_MODE}"
  RM_BASE_URL: "${RM_BASE_URL}"
  RM_API_KEY: "${RM_API_KEY}"
  RM_MODEL: "${RM_MODEL}"
  RM_THINKING: "${RM_THINKING}"
  RM_MAX_CONCURRENCY: "${RM_MAX_CONCURRENCY}"
