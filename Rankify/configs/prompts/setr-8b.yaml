# SetR (8B) — set selection (ACL 2025, "Shifting from Ranking to Set Selection for RAG")
#
# Model output: "... ### Final Selection: [4] [2]"; ids after the last "Final Selection" are used.
# prompt_mode picks one of user_templates:
#   selection_only   direct selection, no reasoning (used in the paper table)
#   selection_IRI    3-step reasoning with Information Requirement Identification
#   selection_woIRI  chain-of-thought without IRI
# Placeholders: {num} number of passages, {question} question text, {context} passage block.
#
# Passage block: text is stripped and internal newlines squashed into one space, then
#   "[i] title: <title>\t<text>" when the passage has a title, otherwise "[i] <text>";
#   passages are joined by passage_separator.

prompt_mode: selection_only
enable_thinking: false
passage_separator: "\n\n\n"
passage_template: "[{idx}] {text}"
passage_template_with_title: "[{idx}] title: {title}\t{text}"

system_message: "You are RankLLM, an intelligent assistant that can rank and select passages based on their relevancy to the query."

user_templates:
  selection_only: |-
    I will provide you with {num} passages, each indicated by a numerical identifier []. Select the passages based on their relevance to the search query: {question}.

    {context}

    Search Query: {question}.
    Select the passages that mostly covers clear and diverse informations to answer the query. Number of passages is unlimited. The format of final output should be '### Final Selection: [] []', e.g., ### Final Selection: [2] [1]. Only respond with the selection results, do not say any word or explain.

  selection_IRI: |-
    I will provide you with {num} passages, each indicated by a numerical identifier []. Select the passages based on their relevance to the search query: {question}.

    {context}


    Search Query: {question}


    Please follow the steps below:
    Step 1. Please list up the information requirements to answer the query.
    Step 2. for each requirement in Step 1, find the passages that has the information of the requirement.
    Step 3. Choose the passages that mostly covers clear and diverse informations to answer the query. Number of passages is unlimited. The format of final output should be '### Final Selection: [] []', e.g., ### Final Selection: [4] [2].

  selection_woIRI: |-
    I will provide you with {num} passages, each indicated by a numerical identifier []. Select the passages based on their relevance to the search query: {question}.

    {context}


    Search Query: {question}


    Select the passages that mostly covers clear and diverse informations to answer the query. Number of passages is unlimited. The format of final output should be '### Final Selection: [] []', e.g., ### Final Selection: [2] [1].
    Let's think step by step.
